name: Build Muse_2 APK

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git zip unzip autoconf automake libtool \
            pkg-config zlib1g-dev libncurses5-dev \
            libncursesw5-dev cmake libffi-dev libssl-dev \
            build-essential

      - name: Install Buildozer
        run: |
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install buildozer cython==0.29.36

      - name: Check project files
        run: |
          test -f main.py || {
            echo "ERROR: main.py not found"
            exit 1
          }
          test -f buildozer.spec || {
            echo "ERROR: buildozer.spec not found"
            exit 1
          }

      - name: Accept Android SDK licenses
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          path = Path("buildozer.spec")
          lines = path.read_text(encoding="utf-8").splitlines()

          start = None
          end = len(lines)

          for i, line in enumerate(lines):
              match = re.match(r"^\s*\[([^\]]+)\]", line)
              if match:
                  if match.group(1).strip().lower() == "app":
                      start = i
                  elif start is not None:
                      end = i
                      break

          if start is None:
              raise SystemExit("Missing [app] section in buildozer.spec")

          key = re.compile(
              r"^\s*#?\s*android\.accept_sdk_license\s*="
          )

          for i in range(start + 1, end):
              if key.match(lines[i]):
                  lines[i] = "android.accept_sdk_license = True"
                  break
          else:
              lines.insert(end, "android.accept_sdk_license = True")

          path.write_text("\n".join(lines) + "\n", encoding="utf-8")
          print("SDK license acceptance configured.")
          PY

      - name: Build APK
        run: |
          buildozer android debug

      - name: Check APK
        run: |
          find bin -maxdepth 1 -type f -name "*.apk" -print
          test -n "$(find bin -maxdepth 1 -type f -name '*.apk' -print -quit)" || {
            echo "ERROR: APK was not generated"
            exit 1
          }

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Muse_2-APK
          path: bin/*.apk
          if-no-files-found: error
